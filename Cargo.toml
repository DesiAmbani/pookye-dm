[package]
name = "pookye-dm"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Pookye Download Manager - a fast segmented, multi-connection download manager"
license = "MIT"
repository = "https://github.com/DesiAmbani/pookye-dm"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.31"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
image = { version = "0.25", default-features = false, features = ["png"] }
dirs = "5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
