<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --bg: #330114;
        --card: #5b0325;
        --accent: #ea0159;
        --bright: #ff2d7a;
        --ink: #ffe9f0;
        --muted: #c292a6;
      }
      body {
        margin: 0;
        width: 290px;
        background: var(--bg);
        color: var(--ink);
        font: 13px/1.45 "Segoe UI", system-ui, sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        border-bottom: 1px solid #2a0110;
      }
      header img {
        width: 30px;
        height: 30px;
        border-radius: 6px;
      }
      h1 {
        font-size: 14px;
        margin: 0;
      }
      .sub {
        color: var(--bright);
        font-size: 11px;
      }
      .body {
        padding: 12px 14px 14px;
        background: var(--card);
      }
      .pill {
        display: inline-block;
        padding: 2px 9px;
        border-radius: 999px;
        font-size: 11px;
        background: #2a0110;
        color: var(--muted);
      }
      .pill.ok {
        background: var(--accent);
        color: #fff;
      }
      p {
        color: var(--muted);
        font-size: 11.5px;
        margin: 10px 0 0;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="icons/icon-48.png" alt="" />
      <div>
        <h1>Pookye DM</h1>
        <div class="sub">Pookye Download Manager</div>
      </div>
    </header>
    <div class="body">
      <span id="status" class="pill">Checking&hellip;</span>
      <p>
        Downloads in this browser are handed to Pookye DM while it runs. Right-click a
        link and choose <strong>Download with Pookye DM</strong> to send one directly.
      </p>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
