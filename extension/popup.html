<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --bg: #330114;
        --card: #5b0325;
        --accent: #ea0159;
        --bright: #ff2d7a;
        --ink: #ffe9f0;
        --muted: #c292a6;
      }
      body {
        margin: 0;
        width: 290px;
        background: var(--bg);
        color: var(--ink);
        font: 13px/1.45 "Segoe UI", system-ui, sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        border-bottom: 1px solid #2a0110;
      }
      header svg {
        width: 30px;
        height: 30px;
        border-radius: 6px;
      }
      h1 {
        font-size: 14px;
        margin: 0;
      }
      .sub {
        color: var(--bright);
        font-size: 11px;
      }
      .body {
        padding: 12px 14px 14px;
        background: var(--card);
      }
      .pill {
        display: inline-block;
        padding: 2px 9px;
        border-radius: 999px;
        font-size: 11px;
        background: #2a0110;
        color: var(--muted);
      }
      .pill.ok {
        background: var(--accent);
        color: #fff;
      }
      p {
        color: var(--muted);
        font-size: 11.5px;
        margin: 10px 0 0;
      }
    </style>
  </head>
  <body>
    <header>
      <svg viewBox="0 0 32 32" width="32" height="32" aria-hidden="true">
        <rect width="32" height="32" rx="7" fill="#EA0159"/>
        <rect x="0" y="2" width="32" height="11" rx="5" fill="#FF2D7A"/>
        <rect x="0.8" y="0.8" width="30.4" height="30.4" rx="6.4" fill="none" stroke="#140006" stroke-width="1.6"/>
        <g fill="#FFE9F0" stroke="#140006" stroke-width="1.1" stroke-linejoin="round">
          <path d="M11.5 8.6 L15.2 10.8 L11.2 13 Z"/>
          <path d="M20.5 9.6 L24.4 13.4 L20.2 13.6 Z"/>
          <path d="M11.2 18.4 L15.4 18 L11 22 Z"/>
          <path d="M20.8 19.2 L24.6 22.4 L20.6 23.4 Z"/>
        </g>
      </svg>
      <div>
        <h1>Pookye DM</h1>
        <div class="sub">Pookye Download Manager</div>
      </div>
    </header>
    <div class="body">
      <span id="status" class="pill">Checking&hellip;</span>
      <p>
        Downloads in this browser are handed to Pookye DM while it runs. Right-click a
        link and choose <strong>Download with Pookye DM</strong> to send one directly.
      </p>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
